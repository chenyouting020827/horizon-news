name: 🇺🇸 US Market Daily Report

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00 (美股开盘前)
    - cron: '0 0 * * 1-5'
  workflow_dispatch:  # 支持手动触发

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Generate US Stock Market Daily Report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run python3 -u scripts/daily_report.py

      - name: Prepare for GitHub Pages
        run: |
          mkdir -p docs/_posts
          mkdir -p docs/assets
          # 复制生成的日报
          if [ -d "data/summaries" ]; then
            for file in data/summaries/*.md; do
              if [ -f "$file" ]; then
                cp "$file" "docs/_posts/$(basename "$file")"
              fi
            done
          fi
          # 也复制 Obsidian 格式的日报
          DAILY_DIR="$HOME/Library/Mobile Documents/iCloud~md~obsidian/Documents/又又的obsidian news/30.areas/finance/US Market Daily"
          if [ -d "$DAILY_DIR" ]; then
            for file in "$DAILY_DIR"/*.md; do
              if [ -f "$file" ]; then
                cp "$file" "docs/_posts/$(basename "$file")"
              fi
            done
          fi

      - name: Set date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "🇺🇸 US Market Daily Report: ${{ env.DATE }}"
          publish_branch: gh-pages
